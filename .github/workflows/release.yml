name: release

# Publishes the plugin binaries that the Pulumi engine downloads at deploy time.
#
# Because this repo is not under the `pulumi` GitHub org, the engine's github plugin
# source resolves a plugin through
#   https://api.github.com/repos/simple-container-com/pulumi-yandex/releases/tags/v<VERSION>
# and looks for an asset named exactly
#   pulumi-resource-yandex-v<VERSION>-<os>-<arch>.tar.gz
# containing a binary named `pulumi-resource-yandex` at the archive root. The asset
# naming below is that contract — do not "tidy" it.
#
# The tag drives the version: `v1.1.0` must match the schema version baked into the
# generated SDK (RespectSchemaVersion is on), so tag and `PROVIDER_VERSION` move together.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build provider
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          go build -C provider \
            -o "${GITHUB_WORKSPACE}/dist/pulumi-resource-yandex" \
            -ldflags "-s -w -X github.com/simple-container-com/pulumi-yandex/provider/pkg/version.Version=${VERSION}" \
            github.com/simple-container-com/pulumi-yandex/provider/cmd/pulumi-resource-yandex
          tar -czf \
            "dist/pulumi-resource-yandex-v${VERSION}-${GOOS}-${GOARCH}.tar.gz" \
            -C dist pulumi-resource-yandex
          rm dist/pulumi-resource-yandex

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Pulumi provider for Yandex Cloud, bridged from yandex-cloud/terraform-provider-yandex. Go SDK: \`go get github.com/simple-container-com/pulumi-yandex/sdk@${GITHUB_REF_NAME}\`" \
            dist/*.tar.gz
